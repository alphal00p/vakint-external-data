name: Validate external data
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 tools/data.py validate
      - run: python3 -m unittest discover -s tests
      - run: python3 tools/data.py pack --output "$RUNNER_TEMP/vakint-release"
      - uses: actions/upload-artifact@v4
        with:
          name: vakint-external-data-release
          path: ${{ runner.temp }}/vakint-release
          if-no-files-found: error
